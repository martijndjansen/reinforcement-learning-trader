[project]
name = "reinforcement-learning-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.2.3",
    "ipywidgets>=8.1.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "stable-baselines3>=2.8.0",
    "tdqm>=0.0.1",
    "wandb>=0.25.1",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
