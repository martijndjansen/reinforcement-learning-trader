[project]
name = "reinforcement-learning-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.2.3",
    "ipywidgets>=8.1.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "stable-baselines3>=2.8.0",
    "tdqm>=0.0.1",
    "wandb>=0.25.1",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = ["ipykernel>=7.2.0", "pre-commit>=4.5.1"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/trader"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # PEP8 formatting
    "F", # logical errors / pyflakes
    "B", # bugbear: suspicious constructs
    "C", # complexity (McCabe)
    # "D",   # docstrings
    "I",   # import cleanliness
    "ANN", # type hints
    "S",   # security issues
]

ignore = []
exclude = ["build", "dist", ".venv", "__pycache__"]
